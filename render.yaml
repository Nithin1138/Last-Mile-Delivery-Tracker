services:
  # Backend FastAPI Service
  - type: web
    name: lastmile-backend
    runtime: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && SEED_IF_EMPTY=1 python seed.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lastmile-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: CORS_ORIGINS
        value: "https://lastmile-frontend.onrender.com,http://localhost:5173"
      - key: SEED_IF_EMPTY
        value: "1"
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.12.8

  # Frontend Static Site
  - type: web
    name: lastmile-frontend
    runtime: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://lastmile-backend.onrender.com"
      - key: VITE_DEMO_MODE
        value: "false"

databases:
  - name: lastmile-db
    databaseName: lastmile_delivery
    user: lastmile_user
    plan: free
